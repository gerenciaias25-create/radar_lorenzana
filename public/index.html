<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Inteligencia Político-Digital | SIE</title>
  <style>
    :root {
      --hdrblue: #1b2a4a;
      --navy: #1C2738;
      --ac: #00C2D4;
      --btn-blue: #1c4980;
      --btn-hover: #153760;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); display: flex; flex-direction: column; }

    /* ENCABEZADO SUPERIOR */
    .top-header {
      background: var(--hdrblue);
      height: 50px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      color: var(--ac);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
    }

    /* CONTENEDOR PRINCIPAL */
    .control-panel {
      padding: 40px 24px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    .panel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }
    .subtitle {
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .title {
      font-size: 24px;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .title span { color: var(--btn-blue); font-weight: 700; }
    .description {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* BARRA DE FORMULARIO DE FILTROS */
    .filter-bar {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .form-control {
      height: 44px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      color: #334155;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--btn-blue);
    }
    
    .input-skill { flex: 1.2; min-width: 180px; font-weight: 600; }
    .input-actor { flex: 2; min-width: 220px; }
    .input-date { flex: 0.8; min-width: 90px; }

    .btn-analizar {
      background: var(--btn-blue);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 28px;
      height: 44px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-analizar:hover {
      background: var(--btn-hover);
    }

    /* SUGERENCIAS RÁPIDAS */
    .suggestions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
    }
    .chip {
      background: #e2e8f0;
      color: #334155;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .chip:hover {
      background: #cbd5e1;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="top-header">RADAR INTELLIGENCE v2.0</div>

  <div class="control-panel">
    <div class="panel-card">
      <div class="subtitle">Análisis Ejecutivo de Fuentes</div>
      <h1 class="title">Módulo de <span>Inteligencia Político-Digital</span></h1>
      <p class="description">Selecciona el tipo de informe y consulta el análisis explícito de datos en tiempo real.</p>

      <!-- FORMULARIO DE NAVEGACIÓN DIRECTA -->
      <form id="search-form" onsubmit="irADashboard(event)" class="filter-bar">
        <!-- Rutas relativas a la carpeta public/skills/ -->
        <select id="skill-select" class="form-control input-skill">
          <option value="skills/radar.html">Skill: RADAR Político</option>
          <option value="skills/emociones.html">Skill: Humor Social / Emociones</option>
          <option value="skills/opositor.html">Skill: Perfil Opositor</option>
          <option value="skills/tensiones.html">Skill: Mapa de Tensiones</option>
        </select>

        <input type="text" id="actor-input" class="form-control input-actor" value="Alfredo Ramírez Bedolla" placeholder="Nombre del actor político..." required>

        <select id="mes-select" class="form-control input-date">
          <option value="Enero">Enero</option>
          <option value="Febrero">Febrero</option>
          <option value="Marzo">Marzo</option>
          <option value="Abril">Abril</option>
          <option value="Mayo">Mayo</option>
          <option value="Junio">Junio</option>
          <option value="Julio" selected>Julio</option>
          <option value="Agosto">Agosto</option>
          <option value="Septiembre">Septiembre</option>
          <option value="Octubre">Octubre</option>
          <option value="Noviembre">Noviembre</option>
          <option value="Diciembre">Diciembre</option>
        </select>

        <select id="anio-select" class="form-control input-date">
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
        </select>

        <button type="submit" class="btn-analizar">Analizar</button>
      </form>

      <div class="suggestions">
        <span>Sugerencias:</span>
        <span class="chip" onclick="setActor('Alfredo Ramírez Bedolla')">Alfredo Ramírez Bedolla</span>
        <span class="chip" onclick="setActor('Horacio Duarte')">Horacio Duarte</span>
        <span class="chip" onclick="setActor('Claudia Sheinbaum')">Claudia Sheinbaum</span>
      </div>
    </div>
  </div>

  <script>
    function setActor(nombre) {
      document.getElementById('actor-input').value = nombre;
    }

    function irADashboard(event) {
      event.preventDefault();

      const skillUrl = document.getElementById('skill-select').value;
      const actor = encodeURIComponent(document.getElementById('actor-input').value);
      const mes = document.getElementById('mes-select').value;
      const anio = document.getElementById('anio-select').value;

      // REDIRECCIÓN COMPLETA DE PÁGINA (Sin iframe, solucionando bloqueo de Vercel)
      window.location.href = `${skillUrl}?actor=${actor}&mes=${mes}&anio=${anio}`;
    }
  </script>

</body>
</html>
