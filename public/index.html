<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma de Inteligencia Político-Digital</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="brand">SIE</div>
  </header>

  <main>
    <!-- SEARCH HERO CON SELECTOR DE SKILLS -->
    <section class="search-hero" id="searchSection">
      <div class="search-eyebrow">Análisis Ejecutivo de Fuentes</div>
      <h1 class="search-heading">Módulo de <span>Inteligencia Político-Digital</span></h1>
      <p class="search-desc">Selecciona el tipo de informe y consulta el análisis explícito de datos en tiempo real.</p>

      <div class="search-form">
        <!-- SELECTOR DE SKILL / SERVICIO -->
        <select id="skillSelect" style="border-right: 1px solid var(--border);">
          <option value="radar" selected>Skill: RADAR Político</option>
          <option value="emociones">Skill: Humores y Emociones (Plutchik)</option>
          <option value="plazas">Skill: Cobertura Territorial / Plazas</option>
        </select>

        <input type="text" id="nombreInput" placeholder="Nombre del actor o territorio..." autocomplete="off" />

        <select id="mesSelect">
          <option value="enero">Enero</option>
          <option value="febrero">Febrero</option>
          <option value="marzo">Marzo</option>
          <option value="abril">Abril</option>
          <option value="mayo">Mayo</option>
          <option value="junio">Junio</option>
          <option value="julio" selected>Julio</option>
          <option value="agosto">Agosto</option>
          <option value="septiembre">Septiembre</option>
          <option value="octubre">Octubre</option>
          <option value="noviembre">Noviembre</option>
          <option value="diciembre">Diciembre</option>
        </select>

        <select id="anioSelect">
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
        </select>

        <button class="btn-search" id="btnAnalizar" onclick="analizar()">Analizar</button>
      </div>

      <div class="suggestion-row">
        <span class="suggestion-label">Sugerencias:</span>
        <button class="chip" onclick="setChip('Horacio Duarte Olivares')">Horacio Duarte</button>
        <button class="chip" onclick="setChip('Claudia Sheinbaum')">Claudia Sheinbaum</button>
        <button class="chip" onclick="setChip('Ciudad de Guatemala')">Ciudad de Guatemala</button>
      </div>
    </section>

    <!-- ESTADO: CARGANDO -->
    <section class="view-state" id="loadingWrap">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p id="loadingMessage">Procesando datos y ejecutando Skill de IA...</p>
      </div>
    </section>

    <!-- ESTADO: ERROR -->
    <section class="view-state" id="errorWrap">
      <div class="error-wrap">
        <strong id="errorTitle">Ocurrió un error al procesar la consulta:</strong>
        <p id="errorText" style="margin-top: 0.5rem;"></p>
        <button class="btn-reset" onclick="resetUI()" style="margin-top: 1rem;">Volver a intentar</button>
      </div>
    </section>

    <!-- ESTADO: DASHBOARD / RESULTADOS -->
    <section class="view-state" id="dashboard">
      <div class="dashboard-header">
        <div>
          <h2 id="dashTitle">Informe Generado</h2>
          <span id="dashSubtitle" style="color: var(--text-muted); font-size: 0.875rem;"></span>
        </div>
        <button class="btn-reset" onclick="resetUI()">← Nueva consulta</button>
      </div>

      <div class="dashboard-content" id="dashboardContent">
        <!-- Contenido dinámico -->
      </div>
    </section>
  </main>

  <script>
    let loadInterval;

    function setChip(val) {
      document.getElementById('nombreInput').value = val;
    }

    function resetUI() {
      document.getElementById('searchSection').style.display = 'block';
      document.getElementById('dashboard').classList.remove('show');
      document.getElementById('errorWrap').classList.remove('show');
      document.getElementById('loadingWrap').classList.remove('show');
      document.getElementById('btnAnalizar').disabled = false;
      clearInterval(loadInterval);
    }

    function startLoad() {
      const msgs = [
        "Consultando fuentes públicas y registros...",
        "Ejecutando modelo de extracción estructurada...",
        "Validando formato JSON del Skill...",
        "Generando métricas visuales..."
      ];
      let idx = 0;
      const msgEl = document.getElementById('loadingMessage');
      msgEl.textContent = msgs[0];
      
      loadInterval = setInterval(() => {
        idx = (idx + 1) % msgs.length;
        msgEl.textContent = msgs[idx];
      }, 2500);
    }

    function stopLoad() {
      clearInterval(loadInterval);
    }

    async function analizar(forceRefresh = false) {
      const nombreInput = document.getElementById('nombreInput');
      const skillSelect = document.getElementById('skillSelect');
      const mesSelect = document.getElementById('mesSelect');
      const anioSelect = document.getElementById('anioSelect');
      
      const nombre = nombreInput.value.trim();
      const skill = skillSelect.value;
      const fecha = `${mesSelect.value} ${anioSelect.value}`;

      if (!nombre) { 
        nombreInput.focus(); 
        return; 
      }

      document.getElementById('searchSection').style.display = 'none';
      document.getElementById('dashboard').classList.remove('show');
      document.getElementById('errorWrap').classList.remove('show');
      document.getElementById('loadingWrap').classList.add('show');
      document.getElementById('btnAnalizar').disabled = true;
      
      startLoad();

      try {
        const res = await fetch('/api/analizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, skill, fecha, forceRefresh })
        });

        const data = await res.json();
        stopLoad();
        document.getElementById('loadingWrap').classList.remove('show');
        document.getElementById('btnAnalizar').disabled = false;

        if (!res.ok || data.error) {
          document.getElementById('errorWrap').classList.add('show');
          document.getElementById('errorText').textContent = data.error || 'Error desconocido al invocar la API.';
          return;
        }

        renderDashboard(data, skill, nombre, fecha);
      } catch (err) {
        stopLoad();
        document.getElementById('loadingWrap').classList.remove('show');
        document.getElementById('errorWrap').classList.add('show');
        document.getElementById('errorText').textContent = err.message;
        document.getElementById('btnAnalizar').disabled = false;
      }
    }

 function renderDashboard(data, skill, nombre, fecha) {
  const dash = document.getElementById('dashboard');
  const content = document.getElementById('dashboardContent');
  
  document.getElementById('dashTitle').textContent = `Informe: ${skill.toUpperCase()}`;
  document.getElementById('dashSubtitle').textContent = `Sujeto: ${data.nombre || nombre} | Periodo: ${fecha}`;

  // 1. Renderizado de Tags
  const tagsHTML = (data.tags || []).map(t => `<span class="chip" style="margin-right: 0.5rem; display: inline-block;">${t}</span>`).join('');

  // 2. Renderizado de KPIs principales
  const kpisHTML = (data.kpis_ampliados || []).map(kpi => `
    <div style="background: rgba(255,255,255,0.05); padding: 1.25rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
      <div style="font-size: 0.75rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.05em;">${kpi.label}</div>
      <div style="font-size: 1.8rem; font-weight: bold; margin: 0.5rem 0; color: #fff;">${kpi.valor}</div>
      <div style="font-size: 0.75rem; color: #718096;">${kpi.nota || ''}</div>
    </div>
  `).join('');

  // 3. Renderizado de Hallazgos / Insights
  const hallazgosHTML = (data.hallazgos_sentimiento || []).map(h => `
    <div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 6px; border-left: 4px solid #3182ce; margin-bottom: 0.75rem;">
      <strong style="display: block; color: #edf2f7; font-size: 0.95rem;">${h.titulo}</strong>
      <p style="margin: 0.25rem 0; font-size: 0.85rem; color: #cbd5e0;">${h.cuerpo}</p>
      <small style="color: #63b3ed; font-style: italic;">Insight: ${h.insight}</small>
    </div>
  `).join('');

  // Ensamble final de la interfaz
  content.innerHTML = `
    <!-- Perfil del Actor -->
    <div style="margin-bottom: 2rem;">
      <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem; color: #fff;">${data.nombre || nombre}</h3>
      <p style="color: #a0aec0; font-size: 0.9rem; margin-bottom: 0.75rem;">${data.cargo || ''}</p>
      <div>${tagsHTML}</div>
    </div>

    <!-- Rejilla de KPIs -->
    <h4 style="margin-bottom: 1rem; color: #e2e8f0;">Métricas Reputacionales</h4>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2.5rem;">
      ${kpisHTML}
    </div>

    <!-- Sección de Hallazgos clave -->
    ${data.hallazgos_sentimiento ? `
      <h4 style="margin-bottom: 1rem; color: #e2e8f0;">Hallazgos Estratégicos</h4>
      <div style="margin-bottom: 2rem;">
        ${hallazgosHTML}
      </div>
    ` : ''}
  `;

  dash.classList.add('show');
}
  </script>
</body>
</html>
