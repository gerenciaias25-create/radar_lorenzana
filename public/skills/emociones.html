<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Análisis Emocional Politico</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --tx1: #0f172a;
      --tx2: #334155;
      --tx3: #64748b;
      --brd: #e2e8f0;
      --prm: #1d4ed8;
      --red: #ef4444;
      --red-s: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--tx1); padding: 1.5rem; }

    /* Layout & Cards */
    .hdr { margin-bottom: 1.5rem; }
    .hdr-name { font-size: 1.5rem; font-weight: 800; color: var(--tx1); }
    .hdr-sub { font-size: 0.875rem; color: var(--tx3); margin-top: 0.25rem; }

    .tabs { display: flex; gap: 0.5rem; border-bottom: 2px solid var(--brd); margin-bottom: 1.5rem; overflow-x: auto; }
    .tab { padding: 0.6rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--tx3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
    .tab.on { color: var(--prm); border-bottom-color: var(--prm); }

    .pnl { display: none; }
    .pnl.on { display: block; }

    .g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
    .g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
    .g4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .gauto { display: grid; grid-template-columns: 380px 1fr; gap: 1rem; }
    @media (max-width: 850px) { .gauto { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); border: 1px solid var(--brd); border-radius: 8px; padding: 1rem; }
    .card2 { background: var(--card-bg); border: 1px solid var(--brd); border-radius: 8px; padding: 1rem; text-align: center; }
    
    .sl { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--tx3); margin-bottom: 0.75rem; letter-spacing: 0.5px; }
    .cv { font-size: 0.75rem; color: var(--tx3); text-transform: uppercase; font-weight: 600; }
    .cval { font-size: 1.75rem; font-weight: 800; margin: 0.25rem 0; }
    .csub { font-size: 0.75rem; color: var(--tx3); }

    /* SVG Rueda */
    .pulse { animation: pulse-anim 2s infinite; }
    @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Elementos interactivos */
    .emr { border-bottom: 1px solid var(--brd); padding: 0.5rem 0; cursor: pointer; }
    .emh { display: flex; align-items: center; gap: 0.5rem; }
    .emd-box { display: none; margin-top: 0.5rem; padding: 0.5rem; background: var(--bg); border-radius: 4px; font-size: 0.8rem; }
    .emd-box.open { display: block; }
    .edk { font-weight: 700; color: var(--tx2); margin-top: 0.25rem; }
    .edv { color: var(--tx3); line-height: 1.4; }

    /* Paneles Específicos */
    .cbox { background: #f1f5f9; border-left: 4px solid var(--prm); padding: 1rem; border-radius: 0 8px 8px 0; }
    .cbox-label { font-size: 0.75rem; font-weight: 700; color: var(--prm); text-transform: uppercase; }
    .cbox-name { font-size: 1.1rem; font-weight: 800; color: var(--tx1); margin: 0.25rem 0; }
    .cbox-text { font-size: 0.85rem; color: var(--tx2); line-height: 1.5; }

    .dyc { background: var(--card-bg); border: 1px solid var(--brd); border-top-width: 4px; border-radius: 8px; padding: 1rem; position: relative; }
    .dybadge { position: absolute; top: 1rem; right: 1rem; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
    .dyn { font-size: 1rem; font-weight: 800; margin-bottom: 0.25rem; }
    .dyf { font-size: 0.75rem; color: var(--tx3); margin-bottom: 0.5rem; }
    .dyt { font-size: 0.8rem; color: var(--tx2); line-height: 1.4; }

    .ac { background: var(--card-bg); border: 1px solid var(--brd); border-radius: 8px; overflow: hidden; }
    .ach { padding: 0.75rem 1rem; background: #f8fafc; border-bottom: 1px solid var(--brd); }
    .acn { font-size: 0.95rem; font-weight: 800; }
    .acr { font-size: 0.75rem; color: var(--tx3); }
    .acb { padding: 0.75rem 1rem; }
    .acrow { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 0.35rem 0; border-bottom: 1px dashed var(--brd); }
    .acrow:last-child { border-bottom: none; }
    .ack { color: var(--tx3); }
    .acv { font-weight: 600; color: var(--tx1); }

    .mpc { background: var(--card-bg); border: 1px solid var(--brd); border-radius: 8px; padding: 1rem; }
    .mptt { font-size: 0.85rem; font-weight: 800; margin-bottom: 0.5rem; }
    .mpi { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.8rem; color: var(--tx2); margin-bottom: 0.4rem; }
    .mpd { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }

    .sem { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--brd); font-size: 0.8rem; }
    .semd { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; display: inline-block; }
    .seml { flex: 1; color: var(--tx2); }
    .semv { font-weight: 700; }

    .qi { background: #f8fafc; border-left: 3px solid var(--prm); padding: 0.6rem 0.8rem; border-radius: 0 4px 4px 0; margin-bottom: 0.5rem; }
    .qt { font-size: 0.8rem; font-style: italic; color: var(--tx2); }
    .qm { font-size: 0.7rem; color: var(--tx3); margin-top: 0.25rem; font-weight: 600; }

    .ri { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--brd); font-size: 0.8rem; }
    .rb { font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; }
    .rt { color: var(--tx2); line-height: 1.4; }
  </style>
</head>
<body>

  <!-- CONTENEDOR RAIZ DONDE SE INYECTARA LA SKILL -->
  <div id="dashboard-root"></div>

  <script>
    /**
     * SKILL ENGINE: EmotionDashboardEngine
     */
    class EmotionDashboardEngine {
      constructor(data, containerId) {
        this.D = data;
        this.container = document.getElementById(containerId);
        this.charts = {};
        
        this.CD = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "#ffffff",
              titleColor: "#1e293b",
              bodyColor: "#475569",
              borderColor: "#cbd5e1",
              borderWidth: 1,
              padding: 10
            }
          },
          scales: {
            x: { grid: { color: "rgba(0,0,0,.05)" }, ticks: { color: "#475569", font: { size: 10 } } },
            y: { grid: { color: "rgba(0,0,0,.05)" }, ticks: { color: "#475569", font: { size: 10 } } }
          }
        };
      }

      buildWheelSVG(emotions) {
        const S = 380, cx = S / 2, cy = S / 2, rings = [72, 112, 150];
        let svg = `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">`;
        
        emotions.forEach((em, i) => {
          const a0 = (em.deg - 22.5) * Math.PI / 180;
          const a1 = (em.deg + 22.5) * Math.PI / 180;
          
          [0, 1, 2].forEach(r => {
            const r0 = rings[r], r1 = rings[r + 1] || rings[r] + 38;
            const x1 = cx + r0 * Math.cos(a0), y1 = cy + r0 * Math.sin(a0);
            const x2 = cx + r1 * Math.cos(a0), y2 = cy + r1 * Math.sin(a0);
            const x3 = cx + r1 * Math.cos(a1), y3 = cy + r1 * Math.sin(a1);
            const x4 = cx + r0 * Math.cos(a1), y4 = cy + r0 * Math.sin(a1);
            
            const fill = em.active && em.intensity > r ? em.color[r] : "#e2e8f0";
            const pulse = em.active && em.intensity === 3 && r === 2 ? ' class="pulse"' : '';
            
            svg += `<path${pulse} d="M${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0,1 ${x3},${y3} L${x4},${y4} A${r0},${r0} 0 0,0 ${x1},${y1}" 
                      fill="${fill}" stroke="#ffffff" stroke-width="1.5" 
                      style="cursor:${em.active ? 'pointer' : 'default'}" 
                      onclick="window.EmotionSkillInstance.toggleEm(${i})"/>`;
          });
          
          const lx = cx + (rings[2] + 22) * Math.cos(em.deg * Math.PI / 180);
          const ly = cy + (rings[2] + 22) * Math.sin(em.deg * Math.PI / 180);
          const anchor = Math.abs(em.deg) > 90 ? "end" : "start";
          
          svg += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" 
                    fill="${em.active ? em.color[2] : '#94a3b8'}" font-size="9" 
                    font-weight="${em.active ? 700 : 400}" font-family="-apple-system,sans-serif">
                    ${em.label.split("/")[0].trim()}
                  </text>`;
        });
        
        svg += `<circle cx="${cx}" cy="${cy}" r="50" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="700">PLUTCHIK</text>
          <text x="${cx}" y="${cy + 6}" text-anchor="middle" fill="#334155" font-size="8">${this.D.territory}</text>
          <text x="${cx}" y="${cy + 18}" text-anchor="middle" fill="#64748b" font-size="7">${this.D.date}</text>
        </svg>`;
        
        return svg;
      }

      renderLayout() {
        const activeCount = this.D.emotions.filter(e => e.active).length;
        const maxIntensity = Math.max(...this.D.emotions.map(e => e.intensity));
        const firstActive = this.D.emotions.find(e => e.active && e.intensity > 0);
        const riskHex = { CRÍTICO: "#ef4444", ALTO: "#f97316", MEDIO: "#b45309" };
        const riskBg = { CRÍTICO: "#fee2e2", ALTO: "#ffedd5", MEDIO: "#fef9c3" };

        this.container.innerHTML = `
          <header class="hdr">
            <div>
              <h1 class="hdr-name">${this.D.territory}</h1>
              <p class="hdr-sub">${this.D.subtitle}</p>
            </div>
          </header>

          <div class="tabs">
            <div class="tab on" onclick="window.EmotionSkillInstance.switchTab('flor', this)">🌸 Flor de Emociones</div>
            <div class="tab" onclick="window.EmotionSkillInstance.switchTab('mapa', this)">🗺 Mapa Social</div>
            <div class="tab" onclick="window.EmotionSkillInstance.switchTab('diadas', this)">⚡ Díadas</div>
            <div class="tab" onclick="window.EmotionSkillInstance.switchTab('identidad', this)">🏛 Identidad Política</div>
            <div class="tab" onclick="window.EmotionSkillInstance.switchTab('actores', this)">👤 Actores</div>
            <div class="tab" onclick="window.EmotionSkillInstance.switchTab('recs', this)">🎯 Recomendaciones</div>
          </div>

          <div class="cnt">
            <div class="g4" style="margin-bottom:1rem">
              <div class="card2"><div class="cv">Nivel de Riesgo</div><div class="cval" style="color:#e11d48">${this.D.riskLevel}</div><div class="csub">Clasificación general</div></div>
              <div class="card2"><div class="cv">Emociones Activas</div><div class="cval" style="color:#1d4ed8">${activeCount}<span style="font-size:1rem;color:var(--tx3)">/8</span></div><div class="csub">Rueda de Plutchik</div></div>
              <div class="card2"><div class="cv">Intensidad Máxima</div><div class="cval" style="color:#b91c1c">${["○","●","●●","●●●"][maxIntensity]}</div><div class="csub">Escala relativa</div></div>
              <div class="card2"><div class="cv">IVE Estimado</div><div class="cval" style="color:#6b21a8">${this.D.iveScore||0}<span style="font-size:1rem">/100</span></div><div class="csub">Volatilidad Emocional</div></div>
            </div>

            <!-- PANEL: FLOR -->
            <div class="pnl on" id="pnl-flor">
              <div class="gauto" style="margin-bottom:1rem">
                <div>
                  <div class="sl">Rueda de Plutchik — ${this.D.territory}</div>
                  <div class="card" style="padding:.8rem;text-align:center;background:#fff;">
                    <div>${this.buildWheelSVG(this.D.emotions)}</div>
                    <div style="font-size:10px;color:var(--tx3);margin-top:.4rem">Toca cualquier pétalo activo para ver detalles</div>
                  </div>
                  <div class="card" style="margin-top:.75rem;padding:.75rem 1rem">
                    <div class="cv">Leyenda de Intensidad</div>
                    <div style="display:flex;gap:1rem;flex-wrap:wrap">
                      <div style="display:flex;align-items:center;gap:5px"><div style="width:11px;height:11px;border-radius:50%;background:${firstActive?firstActive.color[2]:'#ccc'}"></div><span style="font-size:11px;color:var(--tx2)">Alta ●●●</span></div>
                      <div style="display:flex;align-items:center;gap:5px"><div style="width:11px;height:11px;border-radius:50%;background:${firstActive?firstActive.color[1]:'#eee'}"></div><span style="font-size:11px;color:var(--tx2)">Media ●●○</span></div>
                      <div style="display:flex;align-items:center;gap:5px"><div style="width:11px;height:11px;border-radius:50%;background:#e2e8f0;border:1px solid #cbd5e1"></div><span style="font-size:11px;color:var(--tx2)">Inactiva ○○○</span></div>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="sl">Emociones Activas — clic para expandir</div>
                  <div class="card">
                    ${this.D.emotions.map((em, i) => `
                      <div class="emr" onclick="window.EmotionSkillInstance.toggleEm(${i})">
                        <div class="emh">
                          <div style="width:8px;height:8px;border-radius:50%;background:${em.active ? em.color[2] : '#cbd5e1'};flex-shrink:0"></div>
                          <div style="font-size:12.5px;font-weight:${em.active ? 700 : 400};color:${em.active ? 'var(--tx1)' : 'var(--tx3)'};flex:1">${em.label}</div>
                          <div style="font-size:10px;color:${em.active ? em.color[2] : 'var(--tx3)'}">${em.active ? ["●○○","●●○","●●●"][em.intensity - 1] || "" : "○○○"}</div>
                        </div>
                        <div class="emd-box" id="emd-${i}">
                          ${em.active && em.triggers ? `<div class="edk">Detonantes</div><div class="edv">${em.triggers.map(t => `• ${t}`).join("<br>")}</div>` : ""}
                          ${em.active && em.consequences ? `<div class="edk" style="margin-top:6px">Consecuencias</div><div class="edv">${em.consequences.map(c => `• ${c}`).join("<br>")}</div>` : ""}
                          ${!em.active ? `<div class="edv">Sin activación relevante detectada.</div>` : ""}
                        </div>
                      </div>
                    `).join("")}
                  </div>
                  <div class="card" style="margin-top:.75rem;padding:.9rem 1rem">
                    <div class="sl" style="margin-bottom:.5rem">Emociones Secundarias (Latentes)</div>
                    ${this.D.secondary.map(s => `
                      <div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--brd)">
                        <div style="width:7px;height:7px;border-radius:50%;background:${s.color};flex-shrink:0;margin-top:4px"></div>
                        <div><div style="font-size:12px;font-weight:700;color:var(--tx1)">${s.name}</div>
                        <div style="font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.55">${s.text}</div></div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
              <div class="cbox" style="margin-bottom:1rem">
                <div class="cbox-label">Concepto Central del Territorio</div>
                <div class="cbox-name">"${this.D.concept}"</div>
                <div class="cbox-text">${this.D.conceptDesc}</div>
              </div>
              <div class="card">
                <div class="sl">Distribución de Intensidad Emocional</div>
                <div style="height:200px"><canvas id="ch-intens"></canvas></div>
              </div>
            </div>

            <!-- PANEL: MAPA SOCIAL -->
            <div class="pnl" id="pnl-mapa">
              <div class="g3" style="margin-bottom:1rem">
                <div class="mpc"><div class="mptt" style="color:#b45309">⚠ Problemáticas</div>${this.renderListItems(this.D.problematics, "#b45309")}</div>
                <div class="mpc"><div class="mptt" style="color:#b91c1c">⬡ Miedos</div>${this.renderListItems(this.D.fears, "#b91c1c")}</div>
                <div class="mpc"><div class="mptt" style="color:#15803d">★ Orgullos</div>${this.renderListItems(this.D.prides, "#15803d")}</div>
              </div>
              <div class="g2" style="margin-bottom:1rem">
                <div class="card">
                  <div class="sl">Frases Ciudadanas</div>
                  ${this.D.quotes.map(q => `<div class="qi"><div class="qt">${q.text}</div><div class="qm">${q.topic} · ${q.emotion} · ${q.territory}</div></div>`).join("")}
                </div>
                <div class="card">
                  <div class="sl">Emociones por Temática</div>
                  <div style="height:260px"><canvas id="ch-temas"></canvas></div>
                </div>
              </div>
              <div class="card">
                <div class="sl">Semáforo Emocional del Territorio</div>
                <div class="g3">${this.D.semaforo.map(s => `<div class="sem"><div class="semd" style="background:${s.color}"></div><div class="seml">${s.label}</div><div class="semv" style="color:${s.color}">${s.val}</div></div>`).join("")}</div>
              </div>
            </div>

            <!-- PANEL: DÍADAS -->
            <div class="pnl" id="pnl-diadas">
              <div class="g3" style="margin-bottom:1rem">
                ${this.D.dyads.map(d => `
                  <div class="dyc" style="border-top-color:${riskHex[d.risk] || "#64748b"}">
                    <span class="dybadge" style="background:${riskBg[d.risk]};color:${riskHex[d.risk]}">${d.risk}</span>
                    <div class="dyn" style="color:${riskHex[d.risk] || "var(--tx1)"}">${d.name}</div>
                    <div class="dyf">Díada ${d.type} · ${d.formula}</div>
                    <div class="dyt">${d.text}</div>
                  </div>
                `).join("")}
              </div>
              <div class="g2">
                <div class="card">
                  <div class="sl">Score de Riesgo por Díada</div>
                  <div style="height:220px"><canvas id="ch-diadas"></canvas></div>
                </div>
                <div class="card">
                  <div class="sl">Interpretación Estratégica</div>
                  <div style="font-size:12.5px;color:var(--tx2);line-height:1.75;margin-top:.3rem">${this.D.dyadInterp}</div>
                </div>
              </div>
            </div>

            <!-- PANEL: IDENTIDAD POLÍTICA -->
            <div class="pnl" id="pnl-identidad">
              <div class="cbox" style="margin-bottom:1rem">
                <div class="cbox-label">Pregunta Política del Territorio</div>
                <div class="cbox-name" style="font-size:18px">"${this.D.preguntaPolitica}"</div>
                <div class="cbox-text">${this.D.preguntaDesc}</div>
              </div>
              <div class="g2" style="margin-bottom:1rem">
                <div class="card">
                  <div class="sl">Percepción del Gobierno Municipal</div>
                  <div>${this.D.govSemaforo.map(s => `<div class="sem"><div class="semd" style="background:${s.color}"></div><div class="seml">${s.label}</div><div class="semv" style="color:${s.color}">${s.val}</div></div>`).join("")}</div>
                </div>
                <div class="card">
                  <div class="sl">Carga Emocional por Partido</div>
                  <div style="height:220px"><canvas id="ch-partidos"></canvas></div>
                </div>
              </div>
              <div class="card">
                <div class="sl">Percepción Ciudadana por Partido</div>
                <div>${this.D.partidos.map(p => `
                  <div style="display:grid;grid-template-columns:1.3fr 2fr 1fr 1fr;gap:.5rem;padding:8px 0;border-bottom:1px solid var(--brd);font-size:12px">
                    <div style="font-weight:700;color:var(--tx1)">${p.nombre}</div>
                    <div style="color:var(--tx2)">${p.emocion}</div>
                    <div style="color:var(--tx3)">${p.capital}</div>
                    <div style="color:${p.tendencia.includes("↓") ? "#b91c1c" : p.tendencia.includes("↑") ? "#166534" : "#475569"};font-weight:600">${p.tendencia}</div>
                  </div>
                `).join("")}</div>
              </div>
            </div>

            <!-- PANEL: ACTORES -->
            <div class="pnl" id="pnl-actores">
              <div class="g2" style="margin-bottom:1rem">
                ${this.D.actores.map(a => `
                  <div class="ac">
                    <div class="ach" style="border-left:4px solid ${a.borderColor || "#3b82f6"}">
                      <div class="acn">${a.name}</div><div class="acr">${a.role}</div>
                    </div>
                    <div class="acb">
                      ${a.rows.map(([k, v]) => `<div class="acrow"><span class="ack">${k}</span><span class="acv">${v}</span></div>`).join("")}
                    </div>
                  </div>
                `).join("")}
              </div>
              <div class="card">
                <div class="sl">Mapa de Posicionamiento Emocional de Actores</div>
                <div style="height:300px"><canvas id="ch-actores"></canvas></div>
              </div>
            </div>

            <!-- PANEL: RECOMENDACIONES -->
            <div class="pnl" id="pnl-recs">
              <div class="cbox" style="margin-bottom:1rem;border-left-color:var(--red)">
                <div class="cbox-label" style="color:var(--red-s)">Alerta Estratégica</div>
                <div class="cbox-name" style="font-size:16px;color:var(--red-s)">${this.D.alertaEstrategica}</div>
                <div class="cbox-text">${this.D.alertaDesc}</div>
              </div>
              <div class="card" style="margin-bottom:1rem">
                <div class="sl">Plan de Acción Estratégica</div>
                <div>${this.D.recs.map(r => `<div class="ri"><span class="rb" style="background:${r.bg};color:${r.tx}">${r.label}</span><span class="rt">${r.text}</span></div>`).join("")}</div>
              </div>
              <div class="g2">
                <div class="card">
                  <div class="sl">Comunicación Contraproducente — Evitar</div>
                  <div>${this.D.evitar.map(e => `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--brd);font-size:12px;color:var(--tx2)"><span style="color:#ef4444;flex-shrink:0">✕</span>${e}</div>`).join("")}</div>
                </div>
                <div class="card">
                  <div class="sl">Prioridad de Gestión Emocional</div>
                  <div style="height:220px"><canvas id="ch-prior"></canvas></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      renderListItems(arr, color) {
        return arr.map(t => `<div class="mpi"><div class="mpd" style="background:${color}"></div>${t}</div>`).join("");
      }

      initCharts() {
        const acEm = this.D.emotions.filter(e => e.active);
        
        this.charts.intens = new Chart(document.getElementById("ch-intens"), {
          type: "bar",
          data: {
            labels: acEm.map(e => e.label),
            datasets: [{
              data: acEm.map(e => e.intensity),
              backgroundColor: acEm.map(e => e.color[2] + "cc"),
              borderColor: acEm.map(e => e.color[2]),
              borderWidth: 1, borderRadius: 5, borderSkipped: false
            }]
          },
          options: {
            ...this.CD, indexAxis: "y",
            plugins: { ...this.CD.plugins, tooltip: { ...this.CD.plugins.tooltip, callbacks: { label: c => " " + ["Inactiva", "Baja", "Media", "Alta"][c.raw] } } },
            scales: { x: { ...this.CD.scales.x, min: 0, max: 3, ticks: { ...this.CD.scales.x.ticks, stepSize: 1, callback: v => ["○○○", "●○○", "●●○", "●●●"][v] } }, y: { ...this.CD.scales.y } }
          }
        });

        this.charts.temas = new Chart(document.getElementById("ch-temas"), {
          type: "doughnut",
          data: {
            labels: this.D.temasChart.map(t => t[0]),
            datasets: [{ data: this.D.temasChart.map(t => t[1]), backgroundColor: this.D.temasChart.map(t => t[2]), borderColor: "#d5d1d1", borderWidth: 2 }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: "right", labels: { color: "#334155", font: { size: 11 }, boxWidth: 12, padding: 10 } } } }
        });

        const riskHex = { CRÍTICO: "#ef4444", ALTO: "#f97316", MEDIO: "#b45309" };
        this.charts.diadas = new Chart(document.getElementById("ch-diadas"), {
          type: "bar",
          data: {
            labels: this.D.dyads.map(d => d.name),
            datasets: [{ label: "Score de riesgo", data: this.D.dyads.map(d => d.score), backgroundColor: this.D.dyads.map(d => riskHex[d.risk] + "cc"), borderColor: this.D.dyads.map(d => riskHex[d.risk]), borderWidth: 1, borderRadius: 6 }]
          },
          options: { ...this.CD, scales: { x: { ...this.CD.scales.x }, y: { ...this.CD.scales.y, min: 0, max: 100, ticks: { ...this.CD.scales.y.ticks, callback: v => v + "/100" } } } }
        });

        this.charts.partidos = new Chart(document.getElementById("ch-partidos"), {
          type: "bar",
          data: {
            labels: this.D.partidos.map(p => p.nombre),
            datasets: [
              { label: "Ira/Asco", data: this.D.partidosChart.map(x => x[0]), backgroundColor: "#B91C1Caa", borderRadius: 4 },
              { label: "Decep/Tristeza", data: this.D.partidosChart.map(x => x[1]), backgroundColor: "#4C1D95aa", borderRadius: 4 },
              { label: "Interés disp.", data: this.D.partidosChart.map(x => x[2]), backgroundColor: "#059669aa", borderRadius: 4 }
            ]
          },
          options: { ...this.CD, plugins: { ...this.CD.plugins, legend: { display: true } }, scales: { x: { ...this.CD.scales.x }, y: { ...this.CD.scales.y, min: 0, max: 100 } } }
        });

        this.charts.actores = new Chart(document.getElementById("ch-actores"), {
          type: "radar",
          data: {
            labels: ["Legitimidad", "Presencia", "Capital Positivo", "Riesgo Castigo", "Cap. Gestión", "Credibilidad"],
            datasets: this.D.actoresRadar.labels.map((lbl, i) => ({
              label: lbl,
              data: this.D.actoresRadar.data[i],
              borderColor: this.D.actoresRadar.colors[i],
              backgroundColor: this.D.actoresRadar.colors[i] + "22",
              pointBackgroundColor: this.D.actoresRadar.colors[i],
              pointRadius: 4
            }))
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 100 } } }
        });

        this.charts.prior = new Chart(document.getElementById("ch-prior"), {
          type: "bar",
          data: {
            labels: this.D.gestionPrioridad.map(x => x[0]),
            datasets: [{ data: this.D.gestionPrioridad.map(x => x[1]), backgroundColor: this.D.gestionPrioridad.map(x => x[2] + "cc"), borderColor: this.D.gestionPrioridad.map(x => x[2]), borderWidth: 1, borderRadius: 5 }]
          },
          options: { ...this.CD, indexAxis: "y", scales: { x: { ...this.CD.scales.x, min: 0, max: 100 }, y: { ...this.CD.scales.y } } }
        });
      }

      switchTab(tabId, el) {
        document.querySelectorAll(".pnl").forEach(p => p.classList.remove("on"));
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
        document.getElementById("pnl-" + tabId).classList.add("on");
        el.classList.add("on");
      }

      toggleEm(index) {
        const box = document.getElementById(`emd-${index}`);
        if (box) box.classList.toggle("open");
      }

      init() {
        this.renderLayout();
        this.initCharts();
        window.EmotionSkillInstance = this;
      }
    }
