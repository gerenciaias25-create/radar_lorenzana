<div id="comparativo-root">
<style>
#comparativo-root{
  --navy:#1C2738; --card:#d5d1d1; --border:rgba(0,0,0,.15);
  --teal:#00A8B5; --green:#1E8449; --amber:#C49A00; --red:#C0392B; --orange:#D35400;
  --neutral:#555555; --blue2:#1B4F8A; --crisis:#7f1d1d; --crisisbg:#1a0505;
  --text-dark:#1C2738;
  font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  color:var(--text-dark);
  background:#ffffff;
}
#comparativo-root *{box-sizing:border-box;}
#comparativo-root .cheader{position:sticky;top:0;z-index:50;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.1);color:#ffffff;border-radius:8px 8px 0 0;}
#comparativo-root .headwrap{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
#comparativo-root .logo{font-family:'Courier New',monospace;font-weight:800;color:#ffffff;font-size:18px;letter-spacing:1px;}
#comparativo-root .meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
#comparativo-root .alert-badge{display:flex;align-items:center;gap:8px;background:rgba(196,154,0,.2);border:1px solid var(--amber);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:#ffffff;}
#comparativo-root .pulse{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:cpulse 1.6s infinite;}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(196,154,0,.6);}70%{box-shadow:0 0 0 8px rgba(196,154,0,0);}100%{box-shadow:0 0 0 0 rgba(196,154,0,0);}}
#comparativo-root .subtle{color:#d5d1d1;font-size:12px;}
#comparativo-root nav{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.1);}
#comparativo-root nav button{background:none;border:none;color:#d5d1d1;padding:12px 14px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:monospace;}
#comparativo-root nav button.active{color:#ffffff;border-bottom:2px solid var(--teal);font-weight:bold;}
#comparativo-root main{max-width:1320px;margin:0 auto;padding:24px 20px 40px;background:#ffffff;}
#comparativo-root .tab{display:none;}
#comparativo-root .tab.active{display:block;animation:cfade .25s ease;}
@keyframes cfade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
#comparativo-root h2.sec{font-size:20px;margin:0 0 6px;color:var(--text-dark);}
#comparativo-root p.lead{color:#444444;font-size:13.5px;margin:0 0 20px;max-width:920px;}
#comparativo-root .grid{display:grid;gap:14px;}
#comparativo-root .g4{grid-template-columns:repeat(4,1fr);}
#comparativo-root .g3{grid-template-columns:repeat(3,1fr);}
#comparativo-root .g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){#comparativo-root .g4{grid-template-columns:repeat(2,1fr);}#comparativo-root .g3{grid-template-columns:1fr 1fr;}#comparativo-root .g2{grid-template-columns:1fr;}}
#comparativo-root .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;color:var(--text-dark);}
#comparativo-root .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#333333;margin-bottom:6px;font-weight:bold;}
#comparativo-root .kpi .val{font-size:26px;font-weight:800;color:var(--text-dark);}
#comparativo-root .kpi .sub{font-size:11.5px;color:#444444;margin-top:4px;}
#comparativo-root table{width:100%;border-collapse:collapse;font-size:12.5px;}
#comparativo-root th{text-align:left;background:var(--navy);color:#ffffff;padding:8px 10px;font-weight:600;position:sticky;top:0;}
#comparativo-root td{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.1);color:var(--text-dark);}
#comparativo-root tr:hover td{background:rgba(0,0,0,.03);}
#comparativo-root .badge-actor{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}
#comparativo-root .chart-box{position:relative;height:280px;background:#d5d1d1;border-radius:6px;}
#comparativo-root .chart-box.sm{height:220px;}
#comparativo-root .chart-box.lg{height:340px;}
#comparativo-root .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
#comparativo-root .pill-row .lbl{font-size:11.5px;color:#333333;text-transform:uppercase;letter-spacing:.05em;margin-right:4px;font-weight:bold;}
#comparativo-root .pill{background:#ffffff;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text-dark);}
#comparativo-root .pill.on{background:var(--navy);color:#ffffff;border-color:var(--navy);font-weight:700;}
#comparativo-root .pill.alt.on{background:#C49A00;border-color:#C49A00;color:#ffffff;}
#comparativo-root .wordcloud{text-align:center;padding:20px;line-height:1.9;}
#comparativo-root .wordcloud span{display:inline-block;margin:3px 8px;}
#comparativo-root .risk-col h4{margin:0 0 10px;font-size:14px;color:var(--text-dark);}
#comparativo-root .risk-item{border-left:3px solid var(--red);background:rgba(255,255,255,.5);padding:10px 12px;border-radius:6px;margin-bottom:10px;}
#comparativo-root .risk-item.opp{border-left-color:var(--green);}
#comparativo-root .risk-item .lvl{font-size:10px;font-weight:800;letter-spacing:.05em;}
#comparativo-root .risk-item .biv{color:#444444;font-size:11.5px;margin-top:6px;font-style:italic;}
#comparativo-root .footer{background:#1C2738;border-top:1px solid rgba(255,255,255,.1);padding:14px 24px;font-size:11px;color:#94A3B8;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:20px;border-radius:0 0 8px 8px;}
#comparativo-root .note{font-size:11.5px;color:#444444;font-style:italic;margin-top:10px;}
#comparativo-root .divider{height:1px;background:rgba(0,0,0,.1);margin:26px 0;}
#comparativo-root .actor-alert{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;width:fit-content;}
</style>

<header class="cheader">
  <div class="headwrap">
    <div><span class="logo">RADAR/// COMPARATIVO</span></div>
    <div class="meta">
      <div class="alert-badge"><span class="pulse"></span> <span id="c-alerta-txt">Cargando...</span></div>
      <div class="subtle" id="c-periodo-txt"></div>
    </div>
  </div>
  <nav id="c-tabnav"></nav>
</header>

<main id="c-main"></main>

<div class="footer">
  <span id="c-ftr-actores">RADAR · ANÁLISIS BIVARIADO COMPARATIVO</span>
  <span>CONFIDENCIAL &middot; Uso estratégico exclusivo</span>
</div>
</div>
